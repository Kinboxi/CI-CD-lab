# Намеренная ошибка структуры Actions, практикум 1.8.
# Требования: push в main; job inspect; Prepare печатает Start;
# Finish печатает две строки: Status: ready и Done.
name: Command structure case
on:
  push:
    branches: [main]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare
        run: echo Start
      - name: Finish
        run:
          - 'echo "Status: ready"'
          - 'echo "Done"'
