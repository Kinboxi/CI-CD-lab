name: Repository check
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Get repository files
      uses: actions/checkout@v6.0.2
      - name: Check notes
      shell: bash
      run: |
        test -s notes.txt
        cat notes.txt
