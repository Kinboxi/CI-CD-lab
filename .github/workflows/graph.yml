name: graph
on:
  workflow_dispatch:

jobs:
  lints:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Passed"

  tests:
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1

  build:
    runs-on: ubuntu-24.04
    needs: [tests, lints]
    steps:
      - run: echo "Build passed"
  
  summary:
    runs-on: ubuntu-24.04
    needs: [tests, lints]
    if: ${{ always() }}
    steps:
      - name: Show results
        run: |
          echo "Lints: ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.tests.result }}"  

